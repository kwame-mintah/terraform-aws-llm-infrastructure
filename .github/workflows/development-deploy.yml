name: "🔧 Deployment to Development Environment"

permissions: read-all

on:
  # push:
  #   branches:
  #     - main
  pull_request:
    types: [opened, reopened]

env:
  working_dir: "environments/development/${{ secrets.AWS_REGION }}"
  AWS_REGION: "${{ secrets.AWS_REGION }}"
  AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
  AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"

jobs:
  checks:
    runs-on: ubuntu-latest
    environment: "development"
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6.0.1

      - name: "Check terragrunt format HCL"
        uses: gruntwork-io/terragrunt-action@v3.0.2
        with:
          tg_dir: ${{ env.working_dir }}
          tg_command: "hcl fmt --check --diff"

  plan:
    runs-on: ubuntu-latest
    environment: "development"
    needs: [checks]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4.0.0

      - name: "Plan infrastructure changes"
        uses: gruntwork-io/terragrunt-action@v3.0.2
        with:
          tg_dir: ${{ env.working_dir }}
          tg_command: 'plan'

  deploy:
    runs-on: ubuntu-latest
    needs: [plan]
    environment: "development"
    if: github.ref == 'refs/heads/main'
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v6.0.1

      - name: "Deploy infrastructure changes"
        uses: gruntwork-io/terragrunt-action@v3.0.2
        with:
          tg_dir: ${{ env.working_dir }}
          tg_command: 'apply'
